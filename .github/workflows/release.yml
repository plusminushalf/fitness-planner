# Push a tag like v1.2.0 to build an unsigned IPA and publish it, plus the
# SideStore / AltStore source, as a GitHub release. SideStore re-signs it on the
# phone with your own Apple ID.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Version
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build IPA
        run: scripts/build-ipa.sh "$VERSION" "$BUILD_NUMBER"

      - name: Release notes
        run: |
          prev=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          git log --format='- %s' ${prev:+$prev..}"$GITHUB_REF_NAME" > build/notes.md
          cat build/notes.md

      - name: Source feed
        run: scripts/make-source.sh "$VERSION" "$BUILD_NUMBER" build/notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/FitnessPlanner.ipa build/source.json \
            --title "$VERSION (build $BUILD_NUMBER)" \
            --notes-file build/notes.md
